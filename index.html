<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>贪吃蛇 · 竞技场</title>
<style>
  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --accent: #16a34a;
    --accent2: #d97706;
    --danger: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: min(96vw, 760px);
  }
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 14px;
    flex-wrap: wrap;
  }
  .hud .group { display: flex; align-items: center; gap: 14px; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .value.score { color: var(--accent); }
  .stat .value.high { color: var(--accent2); }
  .hud button {
    background: #eef1f6;
    color: var(--text);
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .hud button:hover { background: #e2e8f0; }
  .hud button:active { transform: scale(.96); }

  .arena {
    position: relative;
    width: min(100%, calc(100vh - 220px));
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
    border: 2px solid #d1d5db;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  @supports (height: 100dvh) {
    .arena { width: min(100%, calc(100dvh - 220px)); }
  }
  canvas { display: block; width: 100%; height: auto; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 34px; letter-spacing: 1px; color: var(--accent); }
  .overlay h2 { font-size: 26px; color: var(--danger); }
  .overlay p { color: var(--muted); font-size: 14px; max-width: 340px; line-height: 1.6; }
  .overlay .big-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(22,163,74,.3);
    transition: transform .08s;
  }
  .overlay .big-btn:active { transform: scale(.95); }
  .diff-select { display: flex; gap: 8px; }
  .diff-btn {
    background: #eef1f6;
    color: var(--text);
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .diff-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .rank { width: 100%; max-width: 300px; background: #f1f5f9; border-radius: 10px; padding: 10px 14px; text-align: left; }
  .rank .row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .rank .row .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .rank .row .dead { color: var(--muted); text-decoration: line-through; }

  .controls {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .ability {
    flex: 1;
    position: relative;
    background: var(--panel);
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: background .15s;
    overflow: hidden;
  }
  .ability:active { background: #e2e8f0; }
  .ability .name { font-size: 13px; font-weight: 600; }
  .ability .hint { font-size: 11px; color: var(--muted); }
  .ability.disabled { opacity: .55; cursor: not-allowed; }
  .cd-ring {
    position: relative;
    width: 44px; height: 44px; border-radius: 50%;
    background: conic-gradient(#4ade80 360deg, #e5e7eb 0deg);
    display: flex; align-items: center; justify-content: center;
  }
  .cd-ring .inner {
    width: 34px; height: 34px; border-radius: 50%;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .ability.accel .cd-ring { background: conic-gradient(#60a5fa 360deg, #e5e7eb 0deg); }

  .energy {
    width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden;
  }
  .energy .fill { height: 100%; width: 100%; background: #60a5fa; border-radius: 3px; transition: width .1s linear; }

  .joystick {
    display: none;
    margin: 0 auto;
    touch-action: none;
  }
  .joy-base {
    position: relative;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: #eef1f6;
    border: 2px solid #d1d5db;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.08);
  }
  .joy-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 52px; height: 52px;
    margin-left: -26px; margin-top: -26px;
    border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    pointer-events: none;
  }

  .keyboard-hint { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .keyboard-hint b { color: var(--text); background: #e5e7eb; padding: 1px 6px; border-radius: 4px; }

  @media (max-width: 560px) {
    .joystick { display: block; }
    .keyboard-hint { display: none; }
    .arena { width: 100%; }
    .cd-ring { width: 32px; height: 32px; }
    .cd-ring .inner { width: 24px; height: 24px; font-size: 10px; }
    .ability { padding: 6px; gap: 3px; }
    .ability .name { font-size: 12px; }
    .ability .hint { font-size: 10px; }
  }
  @media (hover: none) {
    .joystick { display: block; }
    .keyboard-hint { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="group">
        <div class="stat"><span class="label">分数</span><span class="value score" id="score">0</span></div>
        <div class="stat"><span class="label">最高</span><span class="value high" id="high">0</span></div>
        <div class="stat"><span class="label">难度</span><span class="value" id="level">1</span></div>
      </div>
      <div class="group">
        <button id="pauseBtn">暂停</button>
        <button id="restartBtn">重开</button>
      </div>
    </div>

    <div class="arena">
      <canvas id="game" width="528" height="528"></canvas>

      <div class="overlay" id="menuOverlay">
        <h1>贪吃蛇 · 竞技场</h1>
        <p>吃掉食物变长，躲避障碍和炸弹，击败所有 AI 蛇！</p>
        <div class="diff-select" id="diffSelect">
          <button class="diff-btn" data-diff="easy">简单</button>
          <button class="diff-btn active" data-diff="medium">普通</button>
          <button class="diff-btn" data-diff="hard">困难</button>
        </div>
        <button class="big-btn" id="startBtn">开始游戏</button>
        <div class="keyboard-hint">
          移动 <b>方向键 / WASD</b><br>
          加速 <b>Shift 按住</b> · 无敌 <b>E</b> · 暂停 <b>P / Esc</b>
        </div>
      </div>

      <div class="overlay hidden" id="pauseOverlay">
        <h1>已暂停</h1>
        <button class="big-btn" id="resumeBtn">继续</button>
      </div>

      <div class="overlay hidden" id="gameoverOverlay">
        <h2 id="endTitle">游戏结束</h2>
        <p id="endMsg"></p>
        <div class="rank" id="rankList"></div>
        <button class="big-btn" id="againBtn">再来一局</button>
      </div>
    </div>

    <div class="controls">
      <button class="ability accel" id="accelBtn">
        <div class="cd-ring"><div class="inner" id="accelIcon">⚡</div></div>
        <span class="name">加速</span>
        <span class="hint">Shift 按住</span>
      </button>
      <button class="ability" id="invBtn">
        <div class="cd-ring"><div class="inner" id="invIcon">🛡️</div></div>
        <span class="name">无敌</span>
        <span class="hint">E · 有冷却</span>
      </button>
    </div>
    <div class="energy"><div class="fill" id="energyFill"></div></div>

    <div class="joystick" id="joystick">
      <div class="joy-base">
        <div class="joy-knob" id="joyKnob"></div>
      </div>
    </div>
    <div class="keyboard-hint" id="kbHint">
      移动 <b>方向键 / WASD</b> · 加速 <b>Shift 按住</b> · 无敌 <b>E</b> · 暂停 <b>P / Esc</b>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 常量 ----------
  const CELL = 22;
  const BASE_SIZE = 24, MAX_SIZE = 48, GROW_STEP = 2, GROW_EVERY = 10;
  let COLS = BASE_SIZE, ROWS = BASE_SIZE;
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  const NORMAL_FOOD_SCORE = 10;
  const SPECIAL_FOOD_SCORE = 50;
  const INVINCIBLE_DURATION = 5000;   // ms
  const INVINCIBLE_COOLDOWN = 12000;  // ms
  const ENERGY_MAX = 100;
  const ENERGY_DRAIN = 40;  // per second while accel
  const ENERGY_REGEN = 22;  // per second when idle
  const AI_COUNT = 3;

  const AI_NAMES = ['红蛇', '蓝蛇', '紫蛇', '橙蛇', '青蛇', '粉蛇', '棕蛇', '灰蛇'];
  const AI_COLORS = ['#ef4444', '#3b82f6', '#a855f7', '#f97316', '#14b8a6', '#ec4899', '#b45309', '#94a3b8'];

  const START_INTERVAL = 260;   // 初始移动间隔 ms
  const MIN_INTERVAL = 120;     // 最快间隔
  const SPEED_STEP = 1.5;       // 每吃一个食物加快的 ms

  const DIFFICULTY = {
    easy:   { label: '简单', aiInterval: [330, 390], noise: 26 },
    medium: { label: '普通', aiInterval: [280, 340], noise: 12 },
    hard:   { label: '困难', aiInterval: [230, 290], noise: 5 },
  };
  let difficulty = 'medium';

  // ---------- DOM ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() {
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
  }
  const $score = document.getElementById('score');
  const $high = document.getElementById('high');
  const $level = document.getElementById('level');
  const $energyFill = document.getElementById('energyFill');
  const $accelIcon = document.getElementById('accelIcon');
  const $invIcon = document.getElementById('invIcon');
  const menuOverlay = document.getElementById('menuOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const gameoverOverlay = document.getElementById('gameoverOverlay');
  const endTitle = document.getElementById('endTitle');
  const endMsg = document.getElementById('endMsg');
  const rankList = document.getElementById('rankList');

  // ---------- 音效 (Web Audio) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type = 'square', vol = 0.12, slide = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  const sfx = {
    eat: () => beep(520, 0.09, 'square', 0.12, 240),
    special: () => { beep(660, 0.1, 'square', 0.12, 300); setTimeout(() => beep(880, 0.12, 'square', 0.12, 200), 90); },
    bomb: () => beep(140, 0.3, 'sawtooth', 0.18, -80),
    death: () => { beep(300, 0.25, 'sawtooth', 0.16, -160); setTimeout(() => beep(150, 0.4, 'sawtooth', 0.16, -80), 140); },
    invincible: () => beep(900, 0.15, 'triangle', 0.14, 400),
    accel: () => beep(700, 0.06, 'triangle', 0.08, 200),
    pause: () => beep(440, 0.1, 'sine', 0.1, -100),
    win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.12), i * 110)); },
  };

  // ---------- 游戏状态 ----------
  let state = 'menu';        // menu | playing | paused | gameover
  let player = null, snakes = [];
  let foods = [], specialFood = null, bombs = [], obstacles = [];
  let score = 0, level = 1;
  let energy = ENERGY_MAX;
  let accelActive = false;
  let invincibleUntil = 0;
  let invincibleCdUntil = 0;
  let foodEaten = 0;
  let nextSpawnLen = 10;
  let aiSpawned = 0;
  let lastFrame = performance.now();
  let spawnTimer = 0, bombTimer = 0;

  const highScore = (() => {
    try { return parseInt(localStorage.getItem('snake_high') || '0', 10) || 0; } catch (e) { return 0; }
  })();
  $high.textContent = highScore;

  // ---------- 工具 ----------
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function key(c) { return c.x + ',' + c.y; }
  function inBounds(c) { return c.x >= 0 && c.x < COLS && c.y >= 0 && c.y < ROWS; }

  // ---------- 蛇类 ----------
  class Snake {
    constructor(x, y, dir, color, name, isPlayer, len = 3) {
      this.body = [{ x, y }];
      for (let i = 1; i < len; i++) {
        const prev = this.body[i - 1];
        this.body.push({ x: prev.x - DIRS[dir].x, y: prev.y - DIRS[dir].y });
      }
      this.dir = dir;
      this.dirQueue = [];
      this.color = color;
      this.name = name;
      this.isPlayer = isPlayer;
      this.alive = true;
      this.grow = 0;
      this.moveInterval = isPlayer ? START_INTERVAL : rand(280, 340);
      this.lastMove = 0;
      this.deathReason = '';
    }
    get head() { return this.body[0]; }
    get length() { return this.body.length; }
    get score2() { return this.body.length; }

    setDirection(d) {
      if (!d || !DIRS[d]) return;
      const last = this.dirQueue.length ? this.dirQueue[this.dirQueue.length - 1] : this.dir;
      if (d === last || d === OPPOSITE[last]) return;
      if (this.dirQueue.length < 3) this.dirQueue.push(d);
    }

    nextDirection() {
      if (this.dirQueue.length) {
        const d = this.dirQueue.shift();
        if (d === OPPOSITE[this.dir]) return this.dir;
        this.dir = d;
      }
      return this.dir;
    }

    step() {
      if (!this.alive) return;
      this.dir = this.nextDirection();
      const v = DIRS[this.dir];
      const head = this.head;
      let nx = head.x + v.x, ny = head.y + v.y;

      const canPass = this.isPlayer && isInvincible();
      if (!inBounds({ x: nx, y: ny })) {
        if (canPass) {
          nx = (nx + COLS) % COLS;
          ny = (ny + ROWS) % ROWS;
        } else {
          this.alive = false;
          this.deathReason = '撞墙';
          return;
        }
      }
      this.body.unshift({ x: nx, y: ny });
      if (this.grow > 0) { this.grow--; }
      else { this.body.pop(); }
    }
  }

  // ---------- 无敌 / 加速 ----------
  function isInvincible() { return performance.now() < invincibleUntil; }
  function invincibleRemaining() { return Math.max(0, invincibleUntil - performance.now()); }
  function invincibleCooldownRemaining() { return Math.max(0, invincibleCdUntil - performance.now()); }

  function tryActivateInvincible() {
    if (state !== 'playing') return;
    if (isInvincible() || invincibleCooldownRemaining() > 0) return;
    invincibleUntil = performance.now() + INVINCIBLE_DURATION;
    invincibleCdUntil = invincibleUntil + INVINCIBLE_COOLDOWN;
    sfx.invincible();
  }

  // ---------- 生成器 ----------
  function randomFreeCell(avoidSnakes = true) {
    for (let i = 0; i < 1000; i++) {
      const c = { x: rand(0, COLS - 1), y: rand(0, ROWS - 1) };
      if (obstacles.some(o => o.x === c.x && o.y === c.y)) continue;
      if (foods.some(f => f.x === c.x && f.y === c.y)) continue;
      if (bombs.some(b => b.x === c.x && b.y === c.y)) continue;
      if (specialFood && specialFood.x === c.x && specialFood.y === c.y) continue;
      if (avoidSnakes && snakes.some(s => s.body.some(b => b.x === c.x && b.y === c.y))) continue;
      return c;
    }
    return null;
  }

  function spawnFoods() {
    while (foods.length < 3) {
      const c = randomFreeCell();
      if (!c) break;
      foods.push(c);
    }
  }

  function spawnSpecialFood() {
    if (!specialFood) {
      const c = randomFreeCell();
      if (c) specialFood = c;
    }
  }

  function spawnBomb() {
    if (bombs.length < 3) {
      const c = randomFreeCell();
      if (c) bombs.push(c);
    }
  }

  function spawnAiSnake(len = 3) {
    const c = randomFreeCell(true);
    if (!c) return null;
    const dir = ['up', 'down', 'left', 'right'][rand(0, 3)];
    const idx = aiSpawned++ % AI_NAMES.length;
    const ai = new Snake(c.x, c.y, dir, AI_COLORS[idx], AI_NAMES[idx], false, len);
    const [lo, hi] = DIFFICULTY[difficulty].aiInterval;
    ai.moveInterval = rand(lo, hi);
    ai.lastMove = performance.now();
    snakes.push(ai);
    return ai;
  }

  function generateObstacles() {
    obstacles = [];
    const count = rand(4, 7);
    let placed = 0, guard = 0;
    while (placed < count && guard++ < 2000) {
      const c = { x: rand(0, COLS - 1), y: rand(0, ROWS - 1) };
      if (snakes.some(s => s.body.some(b => b.x === c.x && b.y === c.y))) continue;
      if (obstacles.some(o => o.x === c.x && o.y === c.y)) continue;
      obstacles.push(c);
      placed++;
    }
  }

  // ---------- AI 逻辑 ----------
  function aiDecide(snake) {
    const head = snake.head;
    const candidate = [];
    for (const d in DIRS) {
      if (d === OPPOSITE[snake.dir]) continue;
      const v = DIRS[d];
      const nx = head.x + v.x, ny = head.y + v.y;
      if (!inBounds({ x: nx, y: ny })) continue;
      const cell = { x: nx, y: ny };
      let score = 0;

      // 致命危险
      if (obstacles.some(o => o.x === nx && o.y === ny)) score -= 500;
      if (bombs.some(b => b.x === nx && b.y === ny)) score -= 300;
      if (snakes.some(s => s.alive && s.body.some(b => b.x === nx && b.y === ny))) score -= 400;

      // 靠近食物
      let best = null, bestDist = Infinity;
      const allFood = foods.concat(specialFood ? [specialFood] : []);
      for (const f of allFood) {
        const dist = Math.abs(f.x - nx) + Math.abs(f.y - ny);
        if (dist < bestDist) { bestDist = dist; best = f; }
      }
      if (best) score += Math.max(0, 30 - bestDist * 3);
      if (specialFood && best === specialFood) score += 20;

      // 空间偏好：避免走入死胡同（简单启发：优先空旷方向）
      const freeNeighbors = (() => {
        let n = 0;
        for (const d2 in DIRS) {
          const v2 = DIRS[d2];
          const ax = nx + v2.x, ay = ny + v2.y;
          if (inBounds({ x: ax, y: ay }) &&
              !obstacles.some(o => o.x === ax && o.y === ay) &&
              !snakes.some(s => s.alive && s.body.some(b => b.x === ax && b.y === ay))) n++;
        }
        return n;
      })();
      score += freeNeighbors * 4;

      // 随机扰动
      score += Math.random() * DIFFICULTY[difficulty].noise;
      candidate.push({ d, score });
    }
    if (!candidate.length) return;
    candidate.sort((a, b) => b.score - a.score);
    const pick = candidate[0].d;
    if (pick !== OPPOSITE[snake.dir]) snake.setDirection(pick);
  }

  // ---------- 碰撞 ----------
  function checkCollisions() {
    const invincible = isInvincible();

    // 玩家吃食物
    if (player.alive) {
      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (player.head.x === f.x && player.head.y === f.y) {
          foods.splice(i, 1);
          player.grow += 1;
          foodEaten += 1;
          addScore(NORMAL_FOOD_SCORE);
          sfx.eat();
        }
      }
      if (specialFood && player.head.x === specialFood.x && player.head.y === specialFood.y) {
        specialFood = null;
        player.grow += 3;
        foodEaten += 3;
        addScore(SPECIAL_FOOD_SCORE);
        sfx.special();
      }
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        if (player.head.x === b.x && player.head.y === b.y) {
          if (!invincible) {
            killPlayer('踩到炸弹');
          }
          bombs.splice(i, 1);
          sfx.bomb();
        }
      }
    }

    // AI 吃食物
    for (const s of snakes) {
      if (!s.alive || s.isPlayer) continue;
      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (s.head.x === f.x && s.head.y === f.y) {
          foods.splice(i, 1);
          s.grow += 1;
        }
      }
      if (specialFood && s.head.x === specialFood.x && s.head.y === specialFood.y) {
        specialFood = null;
        s.grow += 3;
      }
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        if (s.head.x === b.x && s.head.y === b.y) {
          bombs.splice(i, 1);
          killSnake(s, '踩到炸弹');
        }
      }
    }

    // 障碍物碰撞
    for (const s of snakes) {
      if (!s.alive) continue;
      if (obstacles.some(o => o.x === s.head.x && o.y === s.head.y)) {
        if (s.isPlayer && invincible) continue;
        if (s.isPlayer) killPlayer('撞到障碍');
        else { killSnake(s, '撞到障碍'); }
      }
    }

    // 蛇与蛇碰撞（互相，撞到自己身体不会死）
    for (const s of snakes) {
      if (!s.alive) continue;
      const head = s.head;
      for (const other of snakes) {
        if (other === s || !other.alive) continue;
        for (let i = 0; i < other.body.length; i++) {
          const seg = other.body[i];
          if (seg.x === head.x && seg.y === head.y) {
            if (i === 0) {
              // 头撞头
              if (s.isPlayer && invincible) { killSnake(other, '撞到无敌的你'); continue; }
              if (other.isPlayer && invincible) { killSnake(s, '撞到无敌的你'); continue; }
              if (s.isPlayer) killPlayer('与对方蛇头相撞');
              else killSnake(s, '头撞头');
              if (other.isPlayer) killPlayer('与对方蛇头相撞');
              else killSnake(other, '头撞头');
            } else {
              if (s.isPlayer && invincible) continue;
              if (s.isPlayer) killPlayer('撞到对方身体');
              else killSnake(s, '撞到对方身体');
            }
          }
        }
      }
    }
  }

  function addScore(n) {
    score += n;
    $score.textContent = score;
    if (score > highScore) {
      $high.textContent = score;
      try { localStorage.setItem('snake_high', String(score)); } catch (e) {}
    }
  }

  function killPlayer(reason) {
    if (!player.alive) return;
    player.alive = false;
    player.deathReason = reason;
    sfx.death();
  }

  function dropFood(s) {
    for (const seg of s.body) {
      if (!inBounds(seg)) continue;
      if (obstacles.some(o => o.x === seg.x && o.y === seg.y)) continue;
      if (foods.some(f => f.x === seg.x && f.y === seg.y)) continue;
      if (bombs.some(b => b.x === seg.x && b.y === seg.y)) continue;
      if (specialFood && specialFood.x === seg.x && specialFood.y === seg.y) continue;
      foods.push({ x: seg.x, y: seg.y });
    }
  }

  function killSnake(s, reason) {
    if (!s.alive) return;
    s.alive = false;
    s.deathReason = reason;
    dropFood(s);
  }

  // ---------- 难度 ----------
  function updateDifficulty() {
    level = 1 + Math.floor(foodEaten / 20);
    player.moveInterval = Math.max(MIN_INTERVAL, START_INTERVAL - foodEaten * SPEED_STEP);
  }

  // ---------- 输入 ----------
  const keyMap = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };
  window.addEventListener('keydown', (e) => {
    ensureAudio();
    if (keyMap[e.key]) {
      e.preventDefault();
      if (state === 'playing') {
        player.setDirection(keyMap[e.key]);
      }
      return;
    }
    if (e.key === 'Shift') { accelActive = true; }
    if (e.key === 'e' || e.key === 'E') { tryActivateInvincible(); }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); }
    if ((e.key === 'Enter' || e.key === ' ') && state === 'menu') startGame();
    if ((e.key === 'Enter') && state === 'gameover') startGame();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') accelActive = false;
  });

  // 触摸滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    ensureAudio();
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { touchStart = null; return; }
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (state === 'playing') player.setDirection(d);
    touchStart = null;
  });

  // 微信 WebView 适配加固
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('touchend', () => { ensureAudio(); }, { once: true });
  document.addEventListener('touchmove', (e) => {
    const t = e.target;
    if (t && t.closest && (t.closest('.joystick') || t.closest('.controls'))) return;
    e.preventDefault();
  }, { passive: false });

  // 按钮
  document.getElementById('startBtn').addEventListener('click', () => { ensureAudio(); startGame(); });
  document.getElementById('resumeBtn').addEventListener('click', () => { ensureAudio(); togglePause(); });
  document.getElementById('againBtn').addEventListener('click', () => { ensureAudio(); startGame(); });
  document.getElementById('pauseBtn').addEventListener('click', () => { ensureAudio(); togglePause(); });
  document.getElementById('restartBtn').addEventListener('click', () => { ensureAudio(); startGame(); });

  // 难度选择
  document.querySelectorAll('#diffSelect .diff-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      difficulty = btn.dataset.diff;
      document.querySelectorAll('#diffSelect .diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const accelBtn = document.getElementById('accelBtn');
  accelBtn.addEventListener('mousedown', () => { ensureAudio(); accelActive = true; });
  accelBtn.addEventListener('mouseup', () => { accelActive = false; });
  accelBtn.addEventListener('mouseleave', () => { accelActive = false; });
  accelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); accelActive = true; });
  accelBtn.addEventListener('touchend', (e) => { e.preventDefault(); accelActive = false; });

  document.getElementById('invBtn').addEventListener('click', () => { ensureAudio(); tryActivateInvincible(); });

  // 虚拟摇杆（移动端）
  const joystick = document.getElementById('joystick');
  const joyKnob = document.getElementById('joyKnob');
  const JOY_RADIUS = 48;
  let joyActive = false;
  function joyHandle(e) {
    const base = joystick.querySelector('.joy-base');
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    if (dist < 8) { accelActive = false; return; }
    const deg = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
    let dir = 'right';
    if (deg >= 45 && deg < 135) dir = 'down';
    else if (deg >= 135 && deg < 225) dir = 'left';
    else if (deg >= 225 && deg < 315) dir = 'up';
    if (state === 'playing') player.setDirection(dir);
    accelActive = dist > JOY_RADIUS * 0.55;
  }
  function joyReset() {
    joyActive = false;
    joyKnob.style.transform = 'translate(0px, 0px)';
    accelActive = false;
  }
  joystick.addEventListener('pointerdown', (e) => {
    ensureAudio();
    joyActive = true;
    joystick.setPointerCapture(e.pointerId);
    joyHandle(e);
  });
  joystick.addEventListener('pointermove', (e) => { if (joyActive) joyHandle(e); });
  joystick.addEventListener('pointerup', joyReset);
  joystick.addEventListener('pointercancel', joyReset);

  // ---------- 状态机 ----------
  function startGame() {
    ensureAudio();
    COLS = BASE_SIZE; ROWS = BASE_SIZE;
    resizeCanvas();
    player = new Snake(rand(4, COLS - 5), rand(4, ROWS - 5), 'right', '#22c55e', '你', true);
    snakes = [player];
    aiSpawned = 0;
    for (let i = 0; i < AI_COUNT; i++) {
      spawnAiSnake(3);
    }
    foods = []; specialFood = null; bombs = [];
    score = 0; level = 1;
    foodEaten = 0; nextSpawnLen = 10;
    energy = ENERGY_MAX;
    accelActive = false;
    invincibleUntil = 0; invincibleCdUntil = 0;
    spawnTimer = 0; bombTimer = 0;
    $score.textContent = '0';
    $level.textContent = '1';
    $high.textContent = highScore;
    generateObstacles();
    spawnFoods();
    state = 'playing';
    menuOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    lastFrame = performance.now();
    spawnTimer = lastFrame; bombTimer = lastFrame;
    player.lastMove = lastFrame;
    snakes.forEach(s => s.lastMove = lastFrame);
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; pauseOverlay.classList.remove('hidden'); sfx.pause(); }
    else if (state === 'paused') { state = 'playing'; pauseOverlay.classList.add('hidden'); lastFrame = performance.now(); }
  }

  function endGame() {
    state = 'gameover';
    const won = player.alive;
    endTitle.textContent = won ? '胜利！' : '游戏结束';
    endTitle.style.color = won ? 'var(--accent)' : 'var(--danger)';
    endMsg.textContent = won
      ? '你击败了所有 AI 蛇！'
      : (player.deathReason ? `你${player.deathReason}，本局得分 ${score}` : `本局得分 ${score}`);
    if (won) sfx.win();
    const ranking = [...snakes].sort((a, b) => b.body.length - a.body.length);
    rankList.innerHTML = ranking.map(s => {
      const dot = `<span class="dot" style="background:${s.color}"></span>`;
      return `<div class="row ${s.alive ? '' : 'dead'}">` +
             `<span>${dot}${s.name}${s.isPlayer ? '（你）' : ''}</span>` +
             `<span>${s.alive ? '存活' : '阵亡'} · ${s.body.length} 节</span></div>`;
    }).join('');
    gameoverOverlay.classList.remove('hidden');
  }

  // ---------- 主循环 ----------
  function loop(now) {
    const dt = (now - lastFrame) / 1000;
    lastFrame = now;

    if (state === 'playing') {
      // 能量
      if (accelActive && energy > 0) {
        energy = Math.max(0, energy - ENERGY_DRAIN * dt);
      } else {
        energy = Math.min(ENERGY_MAX, energy + ENERGY_REGEN * dt);
      }
      const canAccel = accelActive && energy > 0;

      // 玩家移动
      const interval = canAccel ? player.moveInterval * 0.45 : player.moveInterval;
      if (now - player.lastMove >= interval) {
        player.lastMove = now;
        player.step();
        checkCollisions();
        spawnFoods();
        if (specialFood) {
          if (now - spawnTimer > 8000) { specialFood = null; }
        } else if (now - spawnTimer > 6000) { spawnSpecialFood(); spawnTimer = now; }
        if (now - bombTimer > 5000) { spawnBomb(); bombTimer = now; }
        updateDifficulty();
      }

      // AI 移动
      for (const s of snakes) {
        if (s.isPlayer || !s.alive) continue;
        if (now - s.lastMove >= s.moveInterval) {
          s.lastMove = now;
          aiDecide(s);
          s.step();
        }
      }
      checkCollisions();

      // 长度每 +10 新增 3 条长 9 的蛇
      if (player.alive && player.length >= nextSpawnLen) {
        for (let i = 0; i < 3; i++) spawnAiSnake(9);
        nextSpawnLen += 10;
      }

      // 动态地图：随长度扩容
      const targetSize = Math.min(MAX_SIZE, BASE_SIZE + Math.floor(Math.max(0, player.length - 3) / GROW_EVERY) * GROW_STEP);
      if (targetSize > COLS) {
        COLS = targetSize; ROWS = targetSize;
        resizeCanvas();
      }

      // 结束判定
      const anyAIAlive = snakes.some(s => !s.isPlayer && s.alive);
      if (!player.alive || !anyAIAlive) {
        endGame();
      }
    }

    draw();
    updateUI();
    requestAnimationFrame(loop);
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 网格背景
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#ffffff' : '#eef2f7';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    // 障碍物
    ctx.fillStyle = '#64748b';
    for (const o of obstacles) {
      roundRect(o.x * CELL + 2, o.y * CELL + 2, CELL - 4, CELL - 4, 6);
      ctx.fill();
      ctx.fillStyle = '#334155';
      ctx.fillRect(o.x * CELL + 6, o.y * CELL + 6, CELL - 12, CELL - 12);
      ctx.fillStyle = '#64748b';
    }

    // 炸弹
    for (const b of bombs) {
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.arc(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2, CELL * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2, CELL * 0.18, 0, Math.PI * 2);
      ctx.fill();
      // 引线
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2 - CELL * 0.4);
      ctx.lineTo(b.x * CELL + CELL / 2 + 4, b.y * CELL + CELL / 2 - CELL * 0.55);
      ctx.stroke();
    }

    // 普通食物
    ctx.fillStyle = '#ef4444';
    for (const f of foods) {
      ctx.beginPath();
      ctx.arc(f.x * CELL + CELL / 2, f.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(f.x * CELL + CELL / 2 - 1.5, f.y * CELL + CELL / 2 - CELL * 0.32, 3, CELL * 0.2);
      ctx.fillStyle = '#ef4444';
    }

    // 特殊食物
    if (specialFood) {
      const f = specialFood;
      const cx = f.x * CELL + CELL / 2, cy = f.y * CELL + CELL / 2;
      const pulse = 1 + Math.sin(performance.now() / 150) * 0.15;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#f59e0b';
      drawStar(ctx, 0, 0, 5, CELL * 0.34, CELL * 0.17);
      ctx.fill();
      ctx.restore();
    }

    // 蛇
    for (const s of snakes) {
      if (!s.alive && s !== player) continue;
      const invincibleNow = s.isPlayer && isInvincible();
      for (let i = s.body.length - 1; i >= 0; i--) {
        const seg = s.body[i];
        const alpha = invincibleNow ? (0.45 + Math.sin(performance.now() / 60) * 0.35) : 1;
        ctx.globalAlpha = alpha;
        const t = i / Math.max(1, s.body.length - 1);
        ctx.fillStyle = shadeColor(s.color, -t * 28);
        const pad = i === 0 ? 1 : 3;
        roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 8 : 5);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      // 眼睛
      if (s.alive) {
        drawEyes(s);
      }
      if (invincibleNow) {
        ctx.strokeStyle = 'rgba(74,222,128,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(s.head.x * CELL + CELL / 2, s.head.y * CELL + CELL / 2, CELL * 0.6, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStar(c, cx, cy, spikes, outer, inner) {
    let rot = Math.PI / 2 * 3;
    const step = Math.PI / spikes;
    c.beginPath();
    c.moveTo(cx, cy - outer);
    for (let i = 0; i < spikes; i++) {
      c.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
      rot += step;
      c.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
      rot += step;
    }
    c.lineTo(cx, cy - outer);
    c.closePath();
  }

  function drawEyes(s) {
    const h = s.head;
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    const v = DIRS[s.dir];
    const px = -v.y, py = v.x; // 垂直方向
    const fx = v.x, fy = v.y;   // 前方
    const eyeOff = CELL * 0.2, pupilOff = CELL * 0.12;
    ctx.fillStyle = '#fff';
    for (const side of [1, -1]) {
      const ex = cx + fx * CELL * 0.14 + px * eyeOff * side;
      const ey = cy + fy * CELL * 0.14 + py * eyeOff * side;
      ctx.beginPath();
      ctx.arc(ex, ey, CELL * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(ex + fx * pupilOff, ey + fy * pupilOff, CELL * 0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
    }
  }

  function shadeColor(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  // ---------- UI ----------
  function updateUI() {
    $level.textContent = level;
    $energyFill.style.width = (energy / ENERGY_MAX * 100) + '%';

    // 无敌冷却环
    const cdRemain = invincibleCooldownRemaining();
    const cdTotal = INVINCIBLE_COOLDOWN;
    if (isInvincible()) {
      $invIcon.textContent = (invincibleRemaining() / 1000).toFixed(1);
      $invIcon.closest('.cd-ring').style.background = 'conic-gradient(#4ade80 360deg, #e5e7eb 0deg)';
    } else if (cdRemain > 0) {
      const frac = 1 - cdRemain / cdTotal;
      $invIcon.textContent = Math.ceil(cdRemain / 1000);
      $invIcon.closest('.cd-ring').style.background =
        `conic-gradient(#4ade80 ${frac * 360}deg, #e5e7eb ${frac * 360}deg)`;
    } else {
      $invIcon.textContent = '🛡️';
      $invIcon.closest('.cd-ring').style.background = 'conic-gradient(#4ade80 360deg, #e5e7eb 0deg)';
    }

    // 加速状态
    if (accelActive && energy > 0) {
      $accelIcon.textContent = '⚡';
      $accelIcon.closest('.cd-ring').style.background = 'conic-gradient(#60a5fa 360deg, #e5e7eb 0deg)';
    } else {
      $accelIcon.textContent = '⚡';
      $accelIcon.closest('.cd-ring').style.background =
        `conic-gradient(#60a5fa ${energy / ENERGY_MAX * 360}deg, #e5e7eb 0deg)`;
    }

    document.getElementById('pauseBtn').textContent = state === 'paused' ? '继续' : '暂停';
  }

  // ---------- 启动 ----------
  resizeCanvas();
  updateUI();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
